name: Actualizar cache H2H

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar scraping H2H
        shell: pwsh
        run: ./scripts/update-h2h-cache.ps1

      - name: Commit y push si hubo cambios
        shell: pwsh
        run: |
          git config user.name "cierimar"
          git config user.email "cierimar@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar H2H cache (automatico)"
            git push
          } else {
            Write-Host "Sin cambios en H2H cache."
          }
