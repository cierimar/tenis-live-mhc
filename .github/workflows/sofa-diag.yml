name: Sofa diagnostic
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sofascore endpoints
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          D=2026-08-24
          probe() {
            echo "=== $1"
            curl -s --max-time 20 -A "$UA" -H 'Accept: application/json' -w '\nHTTP %{http_code} LEN %{size_download}\n' "$1" | head -c 1200
            echo ""
          }
          probe "https://api.sofascore.com/api/v1/sport/tennis/scheduled-tournaments/$D/page/1"
          probe "https://api.sofascore.com/api/v1/sport/tennis/scheduled-events/$D"
          probe "https://api.sofascore.com/api/v1/unique-tournament/196861/seasons"
          probe "https://api.sofascore.com/api/v1/unique-tournament/196861/events/$D"
