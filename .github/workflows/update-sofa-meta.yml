name: update-sofa-meta

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Sofascore tournament metadata
        shell: pwsh
        run: ./scripts/update-sofa-meta.ps1

      - name: Commit if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path sofa-meta.json) {
            git add sofa-meta.json
            $diff = git diff --cached --stat
            if ($diff) {
              git commit -m "sofa-meta: hourly tournament metadata update"
              git push
              Write-Host "Pushed"
            } else {
              Write-Host "Sin cambios"
            }
          } else {
            Write-Host "No hay archivo (Sofascore bloqueado)"
          }
