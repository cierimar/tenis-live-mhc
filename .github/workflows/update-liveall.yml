name: update-liveall
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liveall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar live_all.json
        shell: pwsh
        env:
          UA_LIVEALL: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126
        run: ./scripts/update-liveall.ps1

      - name: Commit si hay cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_all.json web-github/live_all.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios - nada que commitear"
          else
            git commit -m "live_all.json auto-update [skip ci]"
            git pull --rebase origin main || true
            git push
          fi