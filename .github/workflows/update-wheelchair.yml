name: Update Wheelchair Tennis Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Fetch wheelchair data from Sofascore
        id: fetch
        run: python scripts/fetch-wheelchair-sofascore.py || echo "FETCH_FAILED=true" >> $GITHUB_OUTPUT

      - name: Check if wheelchair.json was updated
        if: steps.fetch.outputs.FETCH_FAILED != 'true'
        id: check
        run: |
          if git diff --quiet wheelchair.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wheelchair.json web-github/wheelchair.json
          git commit -m "Update wheelchair.json from Sofascore [automated]"
          git push

      - name: Skip — Sofascore blocked
        if: steps.fetch.outputs.FETCH_FAILED == 'true'
        run: echo "::warning::Sofascore returned 403 (datacenter IP blocked). Run fetch-wheelchair-sofascore.ps1 locally instead."
