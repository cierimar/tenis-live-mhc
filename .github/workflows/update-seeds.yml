name: Actualizar seeds (cabezas de serie)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar scraping seeds
        shell: pwsh
        run: ./scripts/update-seeds.ps1

      - name: Commit y push si hubo cambios
        shell: pwsh
        run: |
          git config user.name "cierimar"
          git config user.email "cierimar@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar seeds (automatico)"
            git push
          } else {
            Write-Host "Sin cambios en seeds."
          }
